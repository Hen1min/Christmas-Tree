<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#03050a">
<meta property="og:title" content="Merry Christmas">
<meta property="og:description" content="一棵会发光的圣诞树，拖动可以水平旋转。">
<title>Merry Christmas</title>
<style>
  html, body { margin: 0; height: 100%; background: #03050a; overflow: hidden; }
  canvas#stage { display: block; width: 100vw; height: 100vh; touch-action: none; }
  #title {
    position: fixed; top: 4.5vh; left: 0; right: 0; text-align: center; margin: 0;
    font: 500 clamp(17px, 3vw, 28px)/1.4 "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    letter-spacing: .22em; pointer-events: none; user-select: none;
    background: linear-gradient(92deg, #8ef7c1, #7ed6ff, #c9a6ff);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    opacity: .88;
  }
  #hint {
    position: fixed; bottom: 4.5vh; left: 0; right: 0; text-align: center;
    font: 400 13px/1.6 "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    color: rgba(198, 222, 255, .5); letter-spacing: .14em;
    pointer-events: none; user-select: none; transition: opacity 1s ease;
  }
  #hint.hide { opacity: 0; }
  #fallback {
    position: fixed; inset: 0; display: none; place-items: center;
    color: #cfe3ff; font: 14px/1.8 system-ui, sans-serif; text-align: center; padding: 24px;
  }
  #musicBtn {
    position: fixed; right: 18px; bottom: 4vh; width: 44px; height: 44px;
    border-radius: 50%; border: 1px solid rgba(150, 210, 255, .35);
    background: rgba(12, 22, 34, .55); color: #cfe6ff;
    font: 19px/1 system-ui, sans-serif; cursor: pointer;
    display: grid; place-items: center;
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    transition: opacity .25s ease, transform .25s ease, border-color .25s ease;
    -webkit-tap-highlight-color: transparent;
  }
  #musicBtn:hover { transform: scale(1.06); border-color: rgba(180, 225, 255, .6); }
  #musicBtn.off { opacity: .4; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<h1 id="title">MERRY CHRISTMAS</h1>
<div id="hint">拖动旋转 · 点礼盒开盖 · 滚轮 / 双指缩放</div>
<button id="musicBtn" type="button" aria-label="背景音乐开关">♪</button>
<div id="fallback">当前浏览器无法启用 WebGL，请换用 Chrome / Edge / Safari 打开。</div>

<script type="importmap">
{ "imports": { "three": "./vendor/three.module.js" } }
</script>

<script type="module">
import * as THREE from 'three';

const el = (id) => document.getElementById(id);
const canvas = el('stage');

let renderer;
try {
  renderer = new THREE.WebGLRenderer({
    canvas, antialias: true, alpha: false, powerPreference: 'high-performance'
  });
} catch (err) {
  el('fallback').style.display = 'grid';
  throw err;
}

const DPR = Math.min(window.devicePixelRatio || 1, 2);
renderer.setPixelRatio(DPR);
renderer.setClearColor(0x03050a, 1);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;

const scene = new THREE.Scene();

// 灯光只影响有材质的物体（礼盒、彩球），光点粒子本身是自发光的
scene.add(new THREE.AmbientLight(0x33445c, 1.6));
const keyLight = new THREE.PointLight(0xffd9a8, 16, 16, 2);
keyLight.position.set(1.8, 3.0, 2.6);
scene.add(keyLight);
const fillLight = new THREE.PointLight(0x66d9ff, 9, 14, 2);
fillLight.position.set(-2.6, 1.6, -1.2);
scene.add(fillLight);

const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 400);
const LOOK_AT = new THREE.Vector3(0, 1.72, 0);
let camZ = 8.0;

function layoutCamera() {
  // 竖屏（手机）时把相机拉远一点，免得两侧的礼盒被裁掉
  const fit = window.innerWidth / window.innerHeight < 0.75 ? 1.24 : 1.0;
  camera.position.set(0, 2.6, camZ * fit);
  camera.lookAt(LOOK_AT);
}

/* ---------- 程序化光斑贴图（不依赖任何外部图片） ---------- */
function makeGlowTexture(size = 128) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const g = c.getContext('2d');
  const grd = g.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
  grd.addColorStop(0.00, 'rgba(255,255,255,1)');
  grd.addColorStop(0.25, 'rgba(255,255,255,0.75)');
  grd.addColorStop(0.55, 'rgba(255,255,255,0.22)');
  grd.addColorStop(1.00, 'rgba(255,255,255,0)');
  g.fillStyle = grd;
  g.fillRect(0, 0, size, size);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
const GLOW = makeGlowTexture();

/* 四角星芒贴图：给树上的闪光点用 */
function makeSparkleTexture(size = 128) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const g = c.getContext('2d');
  const cx = size / 2;
  const grd = g.createRadialGradient(cx, cx, 0, cx, cx, cx * 0.55);
  grd.addColorStop(0.0, 'rgba(255,255,255,1)');
  grd.addColorStop(0.30, 'rgba(255,255,255,0.45)');
  grd.addColorStop(1.0, 'rgba(255,255,255,0)');
  g.fillStyle = grd;
  g.beginPath();
  g.arc(cx, cx, cx, 0, Math.PI * 2);
  g.fill();
  g.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 4; i++) {
    g.save();
    g.translate(cx, cx);
    g.rotate((i * Math.PI) / 2);
    const lg = g.createLinearGradient(0, 0, 0, -cx);
    lg.addColorStop(0, 'rgba(255,255,255,0.95)');
    lg.addColorStop(0.55, 'rgba(255,255,255,0.35)');
    lg.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = lg;
    g.beginPath();
    g.moveTo(-cx * 0.055, 0);
    g.lineTo(0, -cx * 0.98);
    g.lineTo(cx * 0.055, 0);
    g.closePath();
    g.fill();
    g.restore();
  }
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
const SPARKLE = makeSparkleTexture();

const H = 3.5;   // 树高
const R = 1.45;  // 底部半径

const treeGroup = new THREE.Group();
scene.add(treeGroup);

/* 树冠整体抬高一点，把底下的树干露出来 */
const canopy = new THREE.Group();
canopy.position.y = 0.42;
treeGroup.add(canopy);

/* ---------- 树干：顶端伸进树冠里，越往上越暗，融进树冠的暗部 ---------- */
const trunkGeo = new THREE.CylinderGeometry(0.10, 0.165, 0.95, 24, 10);
{
  const pos = trunkGeo.attributes.position;
  const colors = new Float32Array(pos.count * 3);
  const cBottom = new THREE.Color(0x7d5433);
  const cTop = new THREE.Color(0x0e0805);
  const tmp = new THREE.Color();
  for (let i = 0; i < pos.count; i++) {
    const y = pos.getY(i);
    const k = THREE.MathUtils.smoothstep(y, -0.08, 0.42);
    tmp.copy(cBottom).lerp(cTop, k);
    // 一点纵向的木纹明暗，免得像塑料
    const grain = 0.88 + 0.12 * Math.sin(y * 46 + Math.atan2(pos.getX(i), pos.getZ(i)) * 5.0);
    tmp.multiplyScalar(grain);
    colors[i * 3 + 0] = tmp.r;
    colors[i * 3 + 1] = tmp.g;
    colors[i * 3 + 2] = tmp.b;
  }
  trunkGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
}

const trunk = new THREE.Mesh(trunkGeo, new THREE.MeshStandardMaterial({
  vertexColors: true, roughness: 0.85, metalness: 0.0,
  emissive: 0x1a0e06, emissiveIntensity: 0.35
}));
trunk.position.y = 0.445;   // 从 -0.03 到 0.92
treeGroup.add(trunk);

// 专门给树干打一盏侧光，免得它跟背景一样黑
const trunkLight = new THREE.PointLight(0xffc98a, 4.5, 5.0, 2);
trunkLight.position.set(0.85, 0.40, 1.05);
treeGroup.add(trunkLight);

/* ---------- 树叶：体积锥体 + 着色器做随时间流动的渐变 ---------- */
const FOLIAGE_COUNT = 20000;
const fPos = new Float32Array(FOLIAGE_COUNT * 3);
const fT = new Float32Array(FOLIAGE_COUNT);
const fSize = new Float32Array(FOLIAGE_COUNT);
const fPhase = new Float32Array(FOLIAGE_COUNT);

for (let i = 0; i < FOLIAGE_COUNT; i++) {
  const t = Math.pow(Math.random(), 0.72);          // 底部更密
  const rMax = R * (1 - t);
  const r = rMax * (0.10 + 0.90 * Math.sqrt(Math.random())); // 填满内部，避免中心空心
  const a = Math.random() * Math.PI * 2;
  fPos[i * 3 + 0] = Math.cos(a) * r;
  fPos[i * 3 + 1] = t * H + (Math.random() - 0.5) * 0.05;
  fPos[i * 3 + 2] = Math.sin(a) * r;
  fT[i] = t;
  fSize[i] = 0.085 + Math.random() * 0.10;
  fPhase[i] = Math.random();
}

const foliageGeo = new THREE.BufferGeometry();
foliageGeo.setAttribute('position', new THREE.BufferAttribute(fPos, 3));
foliageGeo.setAttribute('aT', new THREE.BufferAttribute(fT, 1));
foliageGeo.setAttribute('aSize', new THREE.BufferAttribute(fSize, 1));
foliageGeo.setAttribute('aPhase', new THREE.BufferAttribute(fPhase, 1));

const foliageMat = new THREE.ShaderMaterial({
  uniforms: {
    uTime: { value: 0 },
    uPixelRatio: { value: DPR },
    uHueBase: { value: 0.3 }
  },
  vertexShader: /* glsl */`
    attribute float aT;
    attribute float aSize;
    attribute float aPhase;
    uniform float uTime;
    uniform float uPixelRatio;
    uniform float uHueBase;
    varying vec3 vColor;
    varying float vAlpha;

    vec3 hsv2rgb(vec3 c) {
      vec3 rgb = clamp(abs(mod(c.x * 6.0 + vec3(0.0, 4.0, 2.0), 6.0) - 3.0) - 1.0, 0.0, 1.0);
      return c.z * mix(vec3(1.0), rgb, c.y);
    }

    void main() {
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      float hue = uHueBase + 0.26 * aT + 0.05 * sin(uTime * 0.55 + aT * 5.5);
      vec3 col = hsv2rgb(vec3(fract(hue), 0.86, 1.0));
      float tw = 0.55 + 0.45 * sin(uTime * 2.2 + aPhase * 43.0);
      vColor = col * (0.90 + 0.55 * tw);
      vAlpha = 0.45 + 0.55 * tw;
      gl_PointSize = aSize * (0.82 + 0.5 * (1.0 - aT)) * uPixelRatio * (150.0 / max(-mv.z, 0.001));
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: /* glsl */`
    varying vec3 vColor;
    varying float vAlpha;
    void main() {
      float d = length(gl_PointCoord - vec2(0.5));
      float a = smoothstep(0.5, 0.03, d);
      a = pow(a, 1.9);
      gl_FragColor = vec4(vColor * a, a * vAlpha);
    }
  `,
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending
});

canopy.add(new THREE.Points(foliageGeo, foliageMat));

/* ---------- 螺旋灯带：一圈圈绕上去，光点像电流一样流动 ---------- */
const GARLAND_COUNT = 2400;
const gPos = new Float32Array(GARLAND_COUNT * 3);
const gCol = new Float32Array(GARLAND_COUNT * 3);
const gT = new Float32Array(GARLAND_COUNT);

for (let i = 0; i < GARLAND_COUNT; i++) {
  const t = i / (GARLAND_COUNT - 1);
  const r = R * (1 - t) * 1.03 + 0.02;
  const a = t * Math.PI * 2 * 13;
  gPos[i * 3 + 0] = Math.cos(a) * r;
  gPos[i * 3 + 1] = t * H * 0.98 + 0.03;
  gPos[i * 3 + 2] = Math.sin(a) * r;
  gT[i] = t;
}

const garlandGeo = new THREE.BufferGeometry();
garlandGeo.setAttribute('position', new THREE.BufferAttribute(gPos, 3));
garlandGeo.setAttribute('color', new THREE.BufferAttribute(gCol, 3));

const garlandMat = new THREE.PointsMaterial({
  size: 0.032,
  map: GLOW,
  vertexColors: true,
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
  sizeAttenuation: true
});

canopy.add(new THREE.Points(garlandGeo, garlandMat));

/* ---------- 挂饰：金 / 红 / 白 / 冰蓝的亮点 ---------- */
const ORNAMENT_COUNT = 90;
const oPos = new Float32Array(ORNAMENT_COUNT * 3);
const oCol = new Float32Array(ORNAMENT_COUNT * 3);
const PALETTE = [0xffd479, 0xff6b6b, 0xffffff, 0x9fe8ff];
const tmpColor = new THREE.Color();

for (let i = 0; i < ORNAMENT_COUNT; i++) {
  const t = 0.04 + Math.random() * 0.88;
  const r = R * (1 - t) * (1.02 + Math.random() * 0.04);
  const a = Math.random() * Math.PI * 2;
  oPos[i * 3 + 0] = Math.cos(a) * r;
  oPos[i * 3 + 1] = t * H;
  oPos[i * 3 + 2] = Math.sin(a) * r;
  tmpColor.setHex(PALETTE[i % PALETTE.length]);
  oCol[i * 3 + 0] = tmpColor.r;
  oCol[i * 3 + 1] = tmpColor.g;
  oCol[i * 3 + 2] = tmpColor.b;
}

const ornamentGeo = new THREE.BufferGeometry();
ornamentGeo.setAttribute('position', new THREE.BufferAttribute(oPos, 3));
ornamentGeo.setAttribute('color', new THREE.BufferAttribute(oCol, 3));

const ornamentMat = new THREE.PointsMaterial({
  size: 0.075,
  map: GLOW,
  vertexColors: true,
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
  sizeAttenuation: true
});

canopy.add(new THREE.Points(ornamentGeo, ornamentMat));

/* ---------- 树上的彩球：真正的小球体，靠灯光 + 自发光发亮 ---------- */
const baubleGroup = new THREE.Group();
canopy.add(baubleGroup);
const BAUBLE_COLORS = [0xff4d6d, 0xffd166, 0x4dd6ff, 0xb07bff, 0x37e59b, 0xff9a3d];
const baubles = [];
for (let i = 0; i < 16; i++) {
  const t = 0.10 + Math.random() * 0.74;
  const r = R * (1 - t) * 1.02;
  const a = Math.random() * Math.PI * 2;
  const col = BAUBLE_COLORS[i % BAUBLE_COLORS.length];
  const m = new THREE.Mesh(
    new THREE.SphereGeometry(0.052 + Math.random() * 0.028, 16, 12),
    new THREE.MeshStandardMaterial({
      color: col, emissive: col, emissiveIntensity: 0.85,
      roughness: 0.28, metalness: 0.45
    })
  );
  m.position.set(Math.cos(a) * r, t * H, Math.sin(a) * r);
  m.userData.phase = Math.random() * Math.PI * 2;
  baubleGroup.add(m);
  baubles.push(m);
}

/* ---------- 树上的闪光星芒：随机位置、各自呼吸闪烁 ---------- */
const sparkleGroup = new THREE.Group();
canopy.add(sparkleGroup);
const sparkles = [];
for (let i = 0; i < 18; i++) {
  const t = 0.12 + Math.random() * 0.76;
  const r = R * (1 - t) * (0.9 + Math.random() * 0.16);
  const a = Math.random() * Math.PI * 2;
  const s = new THREE.Sprite(new THREE.SpriteMaterial({
    map: SPARKLE, transparent: true, depthWrite: false,
    blending: THREE.AdditiveBlending, color: 0xfff4d6, opacity: 0.8
  }));
  s.position.set(Math.cos(a) * r, t * H, Math.sin(a) * r);
  const base = 0.18 + Math.random() * 0.2;
  s.scale.setScalar(base);
  s.userData = { base, phase: Math.random() * Math.PI * 2, speed: 0.6 + Math.random() * 1.0 };
  sparkleGroup.add(s);
  sparkles.push(s);
}

/* ---------- 树顶星星：一个光球 + 四道十字flare ---------- */
const starGroup = new THREE.Group();
starGroup.position.set(0, H + 0.16, 0);
canopy.add(starGroup);

const coreMat = new THREE.SpriteMaterial({
  map: GLOW, color: 0xfff3c4, transparent: true,
  depthWrite: false, blending: THREE.AdditiveBlending
});
const starCore = new THREE.Sprite(coreMat);
starCore.scale.setScalar(0.46);
starGroup.add(starCore);

const flareMat = new THREE.SpriteMaterial({
  map: GLOW, color: 0xffe8a8, transparent: true, opacity: 0.6,
  depthWrite: false, blending: THREE.AdditiveBlending
});
const flares = [];
for (let i = 0; i < 3; i++) {
  const f = new THREE.Sprite(flareMat);
  f.material = flareMat.clone();
  const rot = (i * Math.PI) / 3;
  f.scale.set(1.5, 0.07, 1);
  f.material.rotation = rot;
  f.material.opacity = 0.34 - i * 0.08;
  flares.push(f);
  starGroup.add(f);
}

/* ---------- 雪 ---------- */
const SNOW_COUNT = 900;
const sPos = new Float32Array(SNOW_COUNT * 3);
const sSpeed = new Float32Array(SNOW_COUNT);
const sPhase = new Float32Array(SNOW_COUNT);

for (let i = 0; i < SNOW_COUNT; i++) {
  sPos[i * 3 + 0] = (Math.random() - 0.5) * 12;
  sPos[i * 3 + 1] = Math.random() * 8;
  sPos[i * 3 + 2] = (Math.random() - 0.5) * 12;
  sSpeed[i] = 0.12 + Math.random() * 0.3;
  sPhase[i] = Math.random() * Math.PI * 2;
}

const snowGeo = new THREE.BufferGeometry();
snowGeo.setAttribute('position', new THREE.BufferAttribute(sPos, 3));
const snowMat = new THREE.PointsMaterial({
  size: 0.035, map: GLOW, color: 0xdfeaff, transparent: true, opacity: 0.75,
  depthWrite: false, blending: THREE.AdditiveBlending, sizeAttenuation: true
});
const snow = new THREE.Points(snowGeo, snowMat);
scene.add(snow);

/* ---------- 背景星点 ---------- */
const BG_COUNT = 600;
const bPos = new Float32Array(BG_COUNT * 3);
for (let i = 0; i < BG_COUNT; i++) {
  const r = 26 + Math.random() * 22;
  const th = Math.random() * Math.PI * 2;
  const ph = Math.acos(2 * Math.random() - 1);
  bPos[i * 3 + 0] = r * Math.sin(ph) * Math.cos(th);
  bPos[i * 3 + 1] = Math.abs(r * Math.cos(ph)) * 0.6;
  bPos[i * 3 + 2] = r * Math.sin(ph) * Math.sin(th);
}
const bgGeo = new THREE.BufferGeometry();
bgGeo.setAttribute('position', new THREE.BufferAttribute(bPos, 3));
const bgMat = new THREE.PointsMaterial({
  size: 0.09, map: GLOW, color: 0xbfd4ff, transparent: true, opacity: 0.55,
  depthWrite: false, blending: THREE.AdditiveBlending, sizeAttenuation: true
});
const bgStars = new THREE.Points(bgGeo, bgMat);
scene.add(bgStars);

/* ---------- 地面的一圈辉光 ---------- */
const groundGlow = new THREE.Mesh(
  new THREE.CircleGeometry(4.4, 72),
  new THREE.MeshBasicMaterial({
    map: GLOW, color: 0x36ffb0, transparent: true, opacity: 0.10,
    depthWrite: false, blending: THREE.AdditiveBlending
  })
);
groundGlow.rotation.x = -Math.PI / 2;
groundGlow.position.y = -0.015;
scene.add(groundGlow);

/* ---------- 树身外围的柔光：手动做一点 bloom 的扩散感 ---------- */
const halos = [];
for (const cfg of [
  { y: 1.35, scale: 4.8, color: 0x2bff9e, opacity: 0.055 },
  { y: 2.70, scale: 2.9, color: 0x3ad6ff, opacity: 0.05 }
]) {
  const s = new THREE.Sprite(new THREE.SpriteMaterial({
    map: GLOW, color: cfg.color, transparent: true, opacity: cfg.opacity,
    depthWrite: false, blending: THREE.AdditiveBlending
  }));
  s.scale.setScalar(cfg.scale);
  s.position.set(0, cfg.y, 0);
  scene.add(s);
  halos.push(s);
}

/* ---------- 地上的礼盒 ---------- */
const gifts = new THREE.Group();
scene.add(gifts);

const giftSpecs = [
  { w: 0.62, h: 0.50, d: 0.62, x: -1.62, z: 0.80, ry: 0.34, color: 0xe0455c, ribbon: 0xffd98a },
  { w: 0.48, h: 0.42, d: 0.48, x: 1.54, z: 0.88, ry: -0.52, color: 0x2fb8a8, ribbon: 0xfff1cc },
  { w: 0.34, h: 0.30, d: 0.34, x: 0.74, z: 1.70, ry: 0.85, color: 0x8f6cf2, ribbon: 0xffc2e8 },
  { w: 0.40, h: 0.34, d: 0.40, x: -0.62, z: 1.58, ry: -0.22, color: 0x4a7cf0, ribbon: 0xd8e6ff }
];

for (const spec of giftSpecs) {
  const { w, h, d } = spec;
  const group = new THREE.Group();
  group.position.set(spec.x, 0, spec.z);   // 组的原点放在地面上
  group.rotation.y = spec.ry;

  const bodyH = h * 0.72;
  const lidH = h * 0.28;

  const boxMat = new THREE.MeshStandardMaterial({
    color: spec.color, roughness: 0.5, metalness: 0.15,
    emissive: spec.color, emissiveIntensity: 0.22, side: THREE.DoubleSide
  });
  const ribMat = new THREE.MeshStandardMaterial({
    color: spec.ribbon, roughness: 0.3, metalness: 0.35,
    emissive: spec.ribbon, emissiveIntensity: 0.35, side: THREE.DoubleSide
  });

  // 盒体：5 块面拼的开口盒（没有顶面），所以打开盖子看到的是空腔
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(w, d), boxMat);
  floor.rotation.x = -Math.PI / 2;
  floor.position.y = 0;
  group.add(floor);

  const wallFront = new THREE.Mesh(new THREE.PlaneGeometry(w, bodyH), boxMat);
  wallFront.position.set(0, bodyH / 2, d / 2);
  const wallBack = wallFront.clone();
  wallBack.position.z = -d / 2;
  wallBack.rotation.y = Math.PI;
  const wallLeft = new THREE.Mesh(new THREE.PlaneGeometry(d, bodyH), boxMat);
  wallLeft.position.set(-w / 2, bodyH / 2, 0);
  wallLeft.rotation.y = Math.PI / 2;
  const wallRight = wallLeft.clone();
  wallRight.position.x = w / 2;
  wallRight.rotation.y = -Math.PI / 2;
  group.add(wallFront, wallBack, wallLeft, wallRight);

  // 缎带只贴在四个外侧面上，不会在盒子里留一块实心板
  const bandW = w * 0.16;
  const bandD = d * 0.16;
  for (const zs of [1, -1]) {
    const strip = new THREE.Mesh(new THREE.PlaneGeometry(bandW, bodyH), ribMat);
    strip.position.set(0, bodyH / 2, zs * (d / 2 + 0.003));
    strip.rotation.y = zs > 0 ? 0 : Math.PI;
    group.add(strip);
  }
  for (const xs of [1, -1]) {
    const strip = new THREE.Mesh(new THREE.PlaneGeometry(bandD, bodyH), ribMat);
    strip.position.set(xs * (w / 2 + 0.003), bodyH / 2, 0);
    strip.rotation.y = xs > 0 ? Math.PI / 2 : -Math.PI / 2;
    group.add(strip);
  }

  // 盖子：铰链在盒子后沿，绕 X 轴往后翻开
  const lidPivot = new THREE.Group();
  lidPivot.position.set(0, bodyH, -d / 2);
  group.add(lidPivot);

  const lid = new THREE.Mesh(new THREE.BoxGeometry(w * 1.05, lidH, d * 1.05), boxMat);
  lid.position.set(0, lidH / 2, d / 2);
  lidPivot.add(lid);

  const lidBandA = new THREE.Mesh(new THREE.BoxGeometry(w * 0.17, lidH * 1.02, d * 1.07), ribMat);
  lidBandA.position.set(0, lidH / 2, d / 2);
  const lidBandB = new THREE.Mesh(new THREE.BoxGeometry(w * 1.07, lidH * 1.02, d * 0.17), ribMat);
  lidBandB.position.set(0, lidH / 2, d / 2);
  lidPivot.add(lidBandA, lidBandB);

  // 顶上的蝴蝶结，跟着盖子一起翻
  const bowL = new THREE.Mesh(new THREE.BoxGeometry(w * 0.30, h * 0.13, d * 0.10), ribMat);
  bowL.position.set(-w * 0.17, lidH + h * 0.04, d / 2);
  bowL.rotation.z = 0.85;
  const bowR = bowL.clone();
  bowR.position.x = w * 0.17;
  bowR.rotation.z = -0.85;
  lidPivot.add(bowL, bowR);

  // 开盖时从盒子里透出来的暖光
  const innerGlow = new THREE.Sprite(new THREE.SpriteMaterial({
    map: GLOW, color: 0xfff0c4, transparent: true, opacity: 0,
    depthWrite: false, blending: THREE.AdditiveBlending
  }));
  innerGlow.position.y = bodyH * 0.72;
  innerGlow.scale.setScalar(w * 0.95);
  group.add(innerGlow);

  // 盒子底下的一圈暖光，把它压在地面上
  const halo = new THREE.Mesh(
    new THREE.PlaneGeometry(w * 2.6, d * 2.6),
    new THREE.MeshBasicMaterial({
      map: GLOW, color: spec.ribbon, transparent: true, opacity: 0.18,
      depthWrite: false, blending: THREE.AdditiveBlending
    })
  );
  halo.rotation.x = -Math.PI / 2;
  halo.position.y = 0.004;
  group.add(halo);

  group.userData.baseX = spec.x;
  group.userData.lidPivot = lidPivot;
  group.userData.innerGlow = innerGlow;
  group.userData.glowScale = w * 1.25;
  group.userData.openTarget = 0;
  group.userData.openAmount = 0;
  gifts.add(group);
}

// 手机竖屏时把礼盒往中间收，免得最外侧的盒子被屏幕裁掉
function layoutGifts() {
  const narrow = window.innerWidth / window.innerHeight < 0.75;
  const fx = narrow ? 0.76 : 1.0;
  for (const g of gifts.children) {
    g.position.x = g.userData.baseX * fx;
  }
}
layoutGifts();

/* ---------- 交互：拖动水平旋转 + 滚轮 / 双指缩放 ---------- */
const pointers = new Map();
let dragging = false;
let lastX = 0;
let spinVel = 0;          // 拖拽甩出去的惯性（rad/s）
const AUTO_SPIN = 0.22;   // 自转速度
let pinchStartDist = 0;
let pinchStartZ = 0;

const hint = el('hint');
let hintTimer = setTimeout(() => hint.classList.add('hide'), 6000);
function hideHint() {
  clearTimeout(hintTimer);
  hint.classList.add('hide');
}

function pinchDistance() {
  const pts = [...pointers.values()];
  return Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y) || 1;
}

/* 点击礼盒：射线检测，命中哪个就翻哪个的盖子 */
const raycaster = new THREE.Raycaster();
const ndc = new THREE.Vector2();
let downX = 0, downY = 0, downTime = 0;

function pickGift(clientX, clientY) {
  const rect = canvas.getBoundingClientRect();
  ndc.x = ((clientX - rect.left) / rect.width) * 2 - 1;
  ndc.y = -((clientY - rect.top) / rect.height) * 2 + 1;
  raycaster.setFromCamera(ndc, camera);
  const hits = raycaster.intersectObjects(gifts.children, true);
  if (!hits.length) return null;
  let o = hits[0].object;
  while (o && o.parent !== gifts) o = o.parent;
  return o && o.parent === gifts ? o : null;
}

canvas.addEventListener('pointerdown', (e) => {
  canvas.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  hideHint();
  if (pointers.size === 1) {
    dragging = true;
    lastX = e.clientX;
    downX = e.clientX;
    downY = e.clientY;
    downTime = performance.now();
  } else if (pointers.size === 2) {
    dragging = false;
    pinchStartDist = pinchDistance();
    pinchStartZ = camZ;
  }
});

canvas.addEventListener('pointermove', (e) => {
  if (!pointers.has(e.pointerId)) {
    // 没按下时只做悬停手型提示
    canvas.style.cursor = pickGift(e.clientX, e.clientY) ? 'pointer' : 'grab';
    return;
  }
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

  if (pointers.size === 1 && dragging) {
    const dx = e.clientX - lastX;
    lastX = e.clientX;
    treeGroup.rotation.y += dx * 0.0075;
    spinVel = dx * 0.28;
  } else if (pointers.size === 2) {
    const k = pinchDistance() / pinchStartDist;
    camZ = THREE.MathUtils.clamp(pinchStartZ / k, 4.6, 13);
    layoutCamera();
  }
});

function endPointer(e) {
  pointers.delete(e.pointerId);
  if (pointers.size === 0) dragging = false;
}

canvas.addEventListener('pointerup', (e) => {
  const moved = Math.hypot(e.clientX - downX, e.clientY - downY);
  const isClick = e.pointerType !== undefined && moved < 8 && (performance.now() - downTime) < 700;
  const wasSingle = pointers.size === 1;
  endPointer(e);
  if (wasSingle && isClick) {
    const g = pickGift(e.clientX, e.clientY);
    if (g) g.userData.openTarget = g.userData.openTarget > 0.5 ? 0 : 1;
  }
});
canvas.addEventListener('pointercancel', endPointer);
canvas.addEventListener('pointerleave', endPointer);

canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  camZ = THREE.MathUtils.clamp(camZ + e.deltaY * 0.0016, 4.6, 13);
  layoutCamera();
  hideHint();
}, { passive: false });

/* ---------- 背景音乐：WebAudio 现场合成，不依赖任何音频文件 ---------- */
const musicBtn = el('musicBtn');

const NOTE_HZ = {
  C3: 130.81, D3: 146.83, E3: 164.81, F3: 174.61, G3: 196.00, A3: 220.00, B3: 246.94,
  C4: 261.63, D4: 293.66, E4: 329.63, F4: 349.23, G4: 392.00, A4: 440.00, B4: 493.88,
  C5: 523.25, D5: 587.33, E5: 659.25, F5: 698.46, G5: 783.99
};

// Jingle Bells（公有领域）主旋律：音名 + 拍数
const MELODY = [
  ['E4', 1], ['E4', 1], ['E4', 2],
  ['E4', 1], ['E4', 1], ['E4', 2],
  ['E4', 1], ['G4', 1], ['C4', 1.5], ['D4', 0.5], ['E4', 4],
  ['F4', 1], ['F4', 1], ['F4', 1.5], ['F4', 0.5],
  ['F4', 1], ['E4', 1], ['E4', 1], ['E4', 0.5], ['E4', 0.5],
  ['E4', 1], ['D4', 1], ['D4', 1], ['E4', 1], ['D4', 2], ['G4', 2],
  [null, 1]
];
const BASS_PATTERN = ['C3', 'C3', 'F3', 'G3'];

const TEMPO = 104;
const BEAT = 60 / TEMPO;

const audio = {
  ctx: null,
  master: null,
  enabled: true,
  timer: null,
  nextTime: 0,
  step: 0
};

function ensureAudio() {
  if (audio.ctx) return audio.ctx;
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return null;
  audio.ctx = new AC();
  audio.master = audio.ctx.createGain();
  audio.master.gain.value = 0;
  const lp = audio.ctx.createBiquadFilter();
  lp.type = 'lowpass';
  lp.frequency.value = 4000;
  audio.master.connect(lp).connect(audio.ctx.destination);
  return audio.ctx;
}

function playBell(when, freq, dur, peak) {
  const ctx = audio.ctx;
  const osc = ctx.createOscillator();
  osc.type = 'sine';
  osc.frequency.value = freq;
  const partial = ctx.createOscillator();
  partial.type = 'triangle';
  partial.frequency.value = freq * 2.01;
  const pg = ctx.createGain();
  pg.gain.value = 0.22;
  const g = ctx.createGain();
  osc.connect(g);
  partial.connect(pg).connect(g);
  g.gain.setValueAtTime(0.0001, when);
  g.gain.exponentialRampToValueAtTime(peak, when + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, when + dur);
  g.connect(audio.master);
  osc.start(when);
  partial.start(when);
  osc.stop(when + dur + 0.06);
  partial.stop(when + dur + 0.06);
}

function playPad(when, freq, dur) {
  const ctx = audio.ctx;
  const osc = ctx.createOscillator();
  osc.type = 'sine';
  osc.frequency.value = freq;
  const g = ctx.createGain();
  g.gain.setValueAtTime(0.0001, when);
  g.gain.linearRampToValueAtTime(0.05, when + 0.35);
  g.gain.linearRampToValueAtTime(0.0001, when + dur);
  osc.connect(g).connect(audio.master);
  osc.start(when);
  osc.stop(when + dur + 0.05);
}

function scheduleNotes() {
  const ctx = audio.ctx;
  if (!ctx) return;
  const lookahead = 0.4;
  let guard = 0;
  while (audio.nextTime < ctx.currentTime + lookahead && guard++ < 64) {
    const entry = MELODY[audio.step % MELODY.length];
    const name = entry[0];
    const dur = entry[1] * BEAT;
    if (name && NOTE_HZ[name]) {
      playBell(audio.nextTime, NOTE_HZ[name], Math.min(dur * 0.9, 2.0), 0.12);
    }
    if (audio.step % 4 === 0) {
      const bn = BASS_PATTERN[((audio.step / 4) | 0) % BASS_PATTERN.length];
      playPad(audio.nextTime, NOTE_HZ[bn], BEAT * 4);
    }
    audio.nextTime += dur;
    audio.step++;
  }
}

function startMusic() {
  try {
    const ctx = ensureAudio();
    if (!ctx) return;
    if (ctx.state === 'suspended') ctx.resume();
    audio.nextTime = ctx.currentTime + 0.1;
    audio.master.gain.cancelScheduledValues(ctx.currentTime);
    audio.master.gain.setTargetAtTime(0.85, ctx.currentTime, 1.2);
    if (!audio.timer) audio.timer = setInterval(scheduleNotes, 60);
  } catch (err) {
    // 有些环境（旧 Safari / 被策略禁掉）拿不到 AudioContext，静默关掉音乐，不影响画面
    audio.enabled = false;
    musicBtn.classList.add('off');
    console.warn('背景音乐不可用：', err);
  }
}

function stopMusic() {
  if (audio.timer) {
    clearInterval(audio.timer);
    audio.timer = null;
  }
  if (audio.ctx) audio.master.gain.setTargetAtTime(0.0001, audio.ctx.currentTime, 0.2);
}

// 浏览器要求先有用户手势才能出声，所以第一次点/按键才真正开始
let musicStarted = false;
function startMusicOnGesture() {
  if (musicStarted || !audio.enabled) return;
  musicStarted = true;
  startMusic();
}
window.addEventListener('pointerdown', startMusicOnGesture);
window.addEventListener('keydown', startMusicOnGesture);

musicBtn.addEventListener('pointerdown', (e) => e.stopPropagation());
musicBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  // 第一次点这个按钮：先把音乐打开
  if (!musicStarted) {
    musicStarted = true;
    audio.enabled = true;
    musicBtn.classList.remove('off');
    musicBtn.setAttribute('aria-label', '关闭背景音乐');
    startMusic();
    return;
  }
  audio.enabled = !audio.enabled;
  musicBtn.classList.toggle('off', !audio.enabled);
  musicBtn.setAttribute('aria-label', audio.enabled ? '关闭背景音乐' : '开启背景音乐');
  if (audio.enabled) startMusic();
  else stopMusic();
});

/* ---------- 尺寸 ---------- */
function resize() {
  const w = window.innerWidth;
  const h = window.innerHeight;
  renderer.setSize(w, h, false);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  camera.aspect = w / h;
  // 竖屏时把相机拉远一点，免得树被裁掉
  camera.fov = w / h < 0.75 ? 52 : 42;
  camera.updateProjectionMatrix();
  layoutCamera();
  layoutGifts();
  foliageMat.uniforms.uPixelRatio.value = renderer.getPixelRatio();
  renderer.render(scene, camera);
}
window.addEventListener('resize', resize);

/* ---------- 主循环 ---------- */
const clock = new THREE.Clock();
const garlandAttr = garlandGeo.getAttribute('color');
const snowAttr = snowGeo.getAttribute('position');

function animate() {
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  // 树叶颜色整体缓慢走过整个色环 → 颜色一直渐变
  foliageMat.uniforms.uTime.value = t;
  foliageMat.uniforms.uHueBase.value = (0.28 + t * 0.012) % 1;

  // 灯带上的流动光点
  const cols = garlandAttr.array;
  for (let i = 0; i < GARLAND_COUNT; i++) {
    const wave = Math.pow(0.5 + 0.5 * Math.sin(gT[i] * 38 - t * 2.8), 3);
    const k = 0.16 + 0.62 * wave;
    cols[i * 3 + 0] = 1.00 * k;
    cols[i * 3 + 1] = 0.76 * k;
    cols[i * 3 + 2] = 0.40 * k;
  }
  garlandAttr.needsUpdate = true;

  // 挂饰呼吸
  ornamentMat.size = 0.072 + 0.014 * Math.sin(t * 2.2);

  // 彩球明暗 + 星星闪光
  for (let i = 0; i < baubles.length; i++) {
    baubles[i].material.emissiveIntensity = 0.70 + 0.35 * Math.sin(t * 1.4 + baubles[i].userData.phase);
  }
  for (let i = 0; i < sparkles.length; i++) {
    const s = sparkles[i];
    const tw = 0.5 + 0.5 * Math.sin(t * s.userData.speed + s.userData.phase);
    s.scale.setScalar(s.userData.base * (0.55 + 1.10 * tw));
    s.material.opacity = 0.20 + 0.80 * tw;
  }

  // 礼盒开盖 / 合盖
  for (let i = 0; i < gifts.children.length; i++) {
    const ud = gifts.children[i].userData;
    if (!ud.lidPivot) continue;
    ud.openAmount += (ud.openTarget - ud.openAmount) * Math.min(1, dt * 8.0);
    if (Math.abs(ud.openTarget - ud.openAmount) < 0.001) ud.openAmount = ud.openTarget;
    ud.lidPivot.rotation.x = -ud.openAmount * 1.75;
    if (ud.innerGlow) {
      ud.innerGlow.material.opacity = ud.openAmount * (0.34 + 0.12 * Math.sin(t * 3 + i));
      ud.innerGlow.scale.setScalar(ud.glowScale * (0.55 + 0.45 * ud.openAmount) * (1 + 0.05 * Math.sin(t * 3 + i)));
    }
  }

  // 树顶星星
  const pulse = 1 + 0.12 * Math.sin(t * 2.1);
  starCore.scale.setScalar(0.46 * pulse);
  starCore.material.rotation = t * 0.35;
  for (let i = 0; i < flares.length; i++) {
    flares[i].material.opacity = (0.34 - i * 0.08) * (0.75 + 0.25 * Math.sin(t * 1.7 + i));
  }
  starGroup.rotation.y = t * 0.2;

  // 自转 + 甩动惯性
  if (!dragging) {
    treeGroup.rotation.y += AUTO_SPIN * dt;
    treeGroup.rotation.y += spinVel * dt;
    spinVel *= Math.exp(-2.4 * dt);
  }

  // 雪花下落
  const sp = snowAttr.array;
  for (let i = 0; i < SNOW_COUNT; i++) {
    sp[i * 3 + 1] -= sSpeed[i] * dt;
    sp[i * 3 + 0] += Math.sin(t * 0.6 + sPhase[i]) * dt * 0.06;
    if (sp[i * 3 + 1] < -0.2) {
      sp[i * 3 + 1] = 8 + Math.random() * 1.5;
      sp[i * 3 + 0] = (Math.random() - 0.5) * 12;
      sp[i * 3 + 2] = (Math.random() - 0.5) * 12;
    }
  }
  snowAttr.needsUpdate = true;

  // 背景星空缓慢反向转，制造一点纵深
  bgStars.rotation.y -= dt * 0.012;
  groundGlow.material.opacity = 0.085 + 0.025 * Math.sin(t * 0.9);
  halos[0].material.opacity = 0.055 + 0.018 * Math.sin(t * 0.7);
  halos[1].material.opacity = 0.050 + 0.016 * Math.sin(t * 0.9 + 1.4);

  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}

resize();
animate();
</script>
</body>
</html>
