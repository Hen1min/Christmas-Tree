name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read      # deploy-pages 要列本次 run 的 artifact
  pages: write
  id-token: write

# cancel-in-progress: true 会在连续推送时把正在跑的部署掐掉，
# 留下卡住的 deployment，后面的运行就一直失败。这里改成排队执行。
concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r index.html changelog.html vendor audio _site/
          ls -la _site
          du -sh _site

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      # GitHub 的 artifact 列表有最终一致性延迟，紧接着部署偶尔会「Found 0 artifact(s)」
      - name: Wait for artifact to be visible
        run: sleep 10

      - id: deployment
        uses: actions/deploy-pages@v5

